container:
  image: twobrowin/hokku-birthday:2.6.1
  imagePullPolicy: IfNotPresent

  env:
  - name: TZ
    value: Europe/Moscow
  - name: BOT_TOKEN
    valueFrom:
      secretKeyRef:
        name: hokku-birthday
        key: bot_token
  - name: SHEETS_ACC
    valueFrom:
      secretKeyRef:
        name: hokku-birthday
        key: sheet_acc
  - name: SHEETS_LINK
    valueFrom:
      secretKeyRef:
        name: hokku-birthday
        key: sheets_link
  - name: YA_CLOUD_FOLDER_ID
    valueFrom:
      secretKeyRef:
        name: hokku-birthday
        key: ya_cloud_folder_id
  - name: YA_SEARCH_API_ACC
    valueFrom:
      secretKeyRef:
        name: hokku-birthday
        key: ya_search_api_acc
  
  resources:
    requests:
      cpu: 150m
      memory: 150M
    limits:
      cpu: 300m
      memory: 300M